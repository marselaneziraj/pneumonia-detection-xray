name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch, then the package from the clean clone
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: No large files committed
        run: python scripts/check_large_files.py --max-mb 50

      - name: Tests (offline, no dataset, no GPU)
        run: pytest -q

      - name: CLI smoke run on synthetic data
        run: |
          pneumonia make-synthetic --out data_synthetic --n-train 20 --n-test 6 --size 64
          pneumonia prepare --config configs/smoke.yaml
          pneumonia train --config configs/smoke.yaml --limit-train-batches 2
          pneumonia evaluate --configs configs/smoke.yaml
          pneumonia gradcam --config configs/smoke.yaml --per-case 1
