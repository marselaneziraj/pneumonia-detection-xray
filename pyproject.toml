[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumonia-detection-xray"
version = "0.1.0"
description = "Recall-tuned pneumonia detection on paediatric chest X-rays with patient-grouped splits and Grad-CAM explanations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marsela Neziraj" }]
keywords = ["pneumonia", "chest-xray", "medical-imaging", "grad-cam", "pytorch", "densenet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
data = ["kaggle>=1.6"]

[project.scripts]
pneumonia = "pneumonia.cli:main"

[project.urls]
Repository = "https://github.com/marselaneziraj/pneumonia-detection-xray"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
